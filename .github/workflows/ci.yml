# CI: lint, format-check, typecheck, unit test, build and e2e-test every
# push/PR, then deploy the built `dist/` to GitHub Pages on pushes to `main`.
# Both jobs are pinned to ubuntu-24.04: GitHub's "latest" Ubuntu runner moves to 26
# from 19 October 2026, which may change WebKit's system dependencies.
# Depends on: package.json scripts (lint, format:check, typecheck, test, build,
# postbuild, check:contrast, check:headers, check:precache, check:interactives),
# playwright.config.ts, tests/e2e/*.spec.ts.
# Depended on by: GitHub Pages (deploy job).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Format check
        run: npm run format:check
      - run: npm run check:contrast
      - run: npm run check:headers
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:precache
      - run: npm run check:interactives
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
